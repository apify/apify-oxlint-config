# Supply-chain protection: require packages to be at least 7 days old before pnpm will install them.
# Mitigates compromised npm packages discovered and yanked within the first day (shai-hulud worm,
# nx self-replicator, etc.). 10080 minutes = 7 days. Internal @apify/* and @crawlee/* are excluded
# because we publish them ourselves.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@apify/*"
  - "@crawlee/*"
  - "apify-client"
  - "apify"
  - "crawlee"
  - "got-scraping"
